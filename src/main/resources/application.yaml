spring:
  application:
    name: rag
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    vectorstore:
      opensearch:
        uris: http://localhost:50140
        index-name: rag-chunks
        initialize-schema: true
        similarity-function: cosinesimil
        aws:
          enabled: false

    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            model: gemini-embedding-001
        chat:
          model: gemini-3.5-flash-lite
          observations:
            log-prompt: true
            log-completion: true

    mcp:
      client:
        enabled: true
        type: SYNC

        # Maven MCP (local STDIO)
        stdio:
          connections:
            maven-deps-server:
              command: cmd.exe
              args:
                - /c
                - npx
                - -y
                - mcp-maven-deps

        # GitHub MCP (remote HTTP)
        streamable-http:
          connections:
            github:
              url: https://api.githubcopilot.com
              endpoint: /mcp/
github_token: ${GITHUB_TOKEN}

# Observability: export GenAI + HTTP traces to LangSmith via OTLP
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${LANGSMITH_OTLP_ENDPOINT:https://api.smith.langchain.com/otel}
      headers:
        x-api-key: ${LANGSMITH_API_KEY:lsv2_tr_18efe54a7522412b9e844e6a9112fd36_c44ab911dc}
        Langsmith-Project: ${LANGSMITH_PROJECT:springAI-rag}
  observations:
    annotations:
      enabled: true